<div class="filter-panel" role="region" aria-label="Filters for the selected columns">
  <div class="filter-panel-head">
    <span class="filter-panel-title">Filters</span>
  </div>

  @if (filterFields().length === 0) {
    <p class="fp-empty">
      No filterable columns are selected. Open the <strong>Columns</strong> menu and select at
      least one column that supports filtering.
    </p>
  } @else {
    <!-- One input per column selected in the existing Columns dropdown -->
    <div class="fp-grid">
      @for (field of filterFields(); track field.key) {
        <label class="fp-field">
          <span class="fp-label">{{ field.label }}</span>
          @if (field.kind === 'categorical') {
            <p-select
              [options]="categoricalOptionsFor(field.key)"
              optionLabel="label"
              optionValue="value"
              [ngModel]="categoricalValueFor(field.key)"
              (ngModelChange)="onCategoricalChange(field.key, $event)"
              [showClear]="true"
              placeholder="Filter"
              [attr.aria-label]="'Filter by ' + field.label"
              class="w-full"
            />
          } @else {
            <input
              pInputText
              type="text"
              class="fp-text-input w-full"
              [value]="textValueFor(field.key)"
              (input)="onTextInput(field.key, $event)"
              [placeholder]="'Filter ' + field.label"
              [attr.aria-label]="'Filter by ' + field.label"
            />
          }
        </label>
      }
    </div>
  }

  <div class="fp-footer">
    <button
      type="button"
      class="clear-all-btn"
      (click)="clearAll()"
      [disabled]="!hasFilterValues()"
      aria-label="Clear all filters"
    >
      <i class="pi pi-filter-slash text-[11px]" aria-hidden="true"></i>
      Clear All Filters
    </button>
  </div>
</div>
