<button
  type="button"
  (click)="toggle()"
  class="action-trigger"
  [class.is-open]="isOpen()"
  [attr.aria-label]="'Actions for ' + customer().commercialName"
  [attr.aria-haspopup]="'menu'"
  [attr.aria-expanded]="isOpen()"
>
  <i class="pi pi-cog" aria-hidden="true"></i>
  <i
    class="pi action-caret"
    [class.pi-chevron-down]="!isOpen()"
    [class.pi-chevron-up]="isOpen()"
    aria-hidden="true"
  ></i>
</button>

@if (isOpen()) {
  <div
    class="actions-popup"
    role="menu"
    [style.top.px]="popupPosition().top"
    [style.left.px]="popupPosition().left"
  >
    @for (group of actionColumns(); track $index) {
      <div class="actions-popup__column" role="presentation">
        @for (item of group; track item.label) {
          <button
            type="button"
            class="actions-popup__item"
            role="menuitem"
            (click)="runAction(item)"
          >
            <i
              class="pi"
              [class]="'pi ' + item.icon"
              [style.color]="item.color"
              aria-hidden="true"
            ></i>
            <span>{{ item.label }}</span>
          </button>
        }
      </div>
    }
  </div>
}
