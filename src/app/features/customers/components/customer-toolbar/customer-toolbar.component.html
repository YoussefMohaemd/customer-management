<div class="flex flex-col gap-3">
  <div class="toolbar-row flex flex-wrap items-center gap-2.5">
    <!-- Server-side search -->
    <div class="relative min-w-[240px] flex-1">
      <input
        type="text"
        [ngModel]="searchValue()"
        (ngModelChange)="onSearchInput($event)"
        placeholder="Search..."
        aria-label="Search customers"
        class="search-input"
      />
      @if (searchValue()) {
        <button
          type="button"
          (click)="clearSearch()"
          class="absolute right-10 top-1/2 flex h-6 w-6 -translate-y-1/2 items-center justify-center rounded-md text-slate-400 transition hover:bg-slate-100 hover:text-slate-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/60"
          aria-label="Clear search"
        >
          <i class="pi pi-times text-xs"></i>
        </button>
      }
      <i
        class="pi pi-microphone pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-[13px] text-slate-400"
        aria-hidden="true"
      ></i>
    </div>

    <!-- Filter (button only — the panel renders below the toolbar row) -->
    <button
      type="button"
      class="filter-button"
      [class.open]="filtersPanelOpen()"
      (click)="toggleFiltersPanel()"
      [attr.aria-expanded]="filtersPanelOpen()"
      aria-label="Toggle filters"
    >
      <i class="pi pi-filter text-[13px]" aria-hidden="true"></i>
      <span class="hidden sm:inline">Filter</span>
      @if (store.totalFilterCount() > 0) {
        <span class="filter-count" aria-label="{{ store.totalFilterCount() }} active filters">
          {{ store.totalFilterCount() }}
        </span>
      }
      <i
        class="pi pi-angle-down text-[10px] text-slate-400 transition-transform duration-150"
        [class.rotate-180]="filtersPanelOpen()"
        aria-hidden="true"
      ></i>
    </button>

    <!-- Selected filter chips (derived from the active filter state) -->
    @if (activeChips().length > 0) {
      <div class="flex flex-wrap items-center gap-1.5">
        @for (chip of activeChips(); track chip.key) {
          <span class="filter-chip">
            <span class="filter-chip-label">{{ chip.label }}</span>
            @if (chip.value) {
              <span class="filter-chip-value">: {{ chip.value }}</span>
            }
            <button
              type="button"
              class="filter-chip-remove"
              (click)="removeChip(chip.key)"
              [attr.aria-label]="'Remove ' + chip.label + ' filter'"
            >
              <i class="pi pi-times text-[9px]" aria-hidden="true"></i>
            </button>
          </span>
        }
      </div>
    }

    <!-- Dynamic column selection dropdown -->
    <app-customer-column-picker class="ml-auto" />
  </div>

  <!-- Filter panel: a separate block underneath the whole toolbar row, never
       a flex item of the row, so opening it can never move the search,
       the Filter button or the column dropdown. -->
  @if (filtersPanelOpen()) {
    <app-customer-filters />
  }
</div>
