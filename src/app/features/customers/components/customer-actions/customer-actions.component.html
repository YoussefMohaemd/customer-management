<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">
  @for (card of cards; track card.title) {
    <button
      type="button"
      (click)="onOpen(card)"
      class="group flex items-start gap-4 rounded-xl border border-slate-200 bg-white p-4 text-left shadow-sm transition hover:-translate-y-0.5 hover:border-blue-200 hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/60"
      [class.!border-blue-500]="store.activeAction()?.id === card.id"
      [class.!ring-2]="store.activeAction()?.id === card.id"
      [class.!ring-blue-500]="store.activeAction()?.id === card.id"
      [class.!bg-blue-50/20]="store.activeAction()?.id === card.id"
    >
      <div
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg"
        [class]="accentStyle(card.accent)"
        aria-hidden="true"
      >
        <i [class]="card.icon" class="pi text-lg"></i>
      </div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between gap-2 text-sm font-semibold text-slate-800">
          <span>{{ card.title }}</span>
          @if (store.activeAction()?.id === card.id) {
            <span class="rounded bg-blue-100 px-1.5 py-0.5 text-[10px] font-bold text-blue-700">Active</span>
          } @else {
            <i
              class="pi pi-arrow-up-right text-xs text-slate-300 transition group-hover:text-blue-500"
              aria-hidden="true"
            ></i>
          }
        </div>
        <p class="mt-1 text-xs leading-5 text-slate-400">{{ card.description }}</p>
      </div>
    </button>
  }
</div>
