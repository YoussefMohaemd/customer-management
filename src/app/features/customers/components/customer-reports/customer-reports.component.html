<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
  @for (report of cards; track report.title) {
    <button
      type="button"
      (click)="onOpen(report)"
      class="group overflow-hidden rounded-xl border border-slate-200 bg-white text-left shadow-sm transition hover:-translate-y-0.5 hover:border-blue-200 hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/60"
      [class.!border-blue-500]="store.activeReport()?.id === report.id"
      [class.!ring-2]="store.activeReport()?.id === report.id"
      [class.!ring-blue-500]="store.activeReport()?.id === report.id"
      [class.!bg-blue-50/10]="store.activeReport()?.id === report.id"
    >
      <div class="h-1.5 w-full bg-gradient-to-r" [class]="report.accent" aria-hidden="true"></div>
      <div class="p-4">
        <div class="mb-3 flex items-center justify-between">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-lg bg-slate-50 text-slate-500 transition group-hover:bg-blue-50 group-hover:text-blue-600"
            aria-hidden="true"
          >
            <i [class]="report.icon" class="pi text-base"></i>
          </div>
          @if (store.activeReport()?.id === report.id) {
            <span class="rounded bg-blue-100 px-1.5 py-0.5 text-[10px] font-bold text-blue-700">Active</span>
          }
        </div>
        <div class="text-sm font-semibold text-slate-800">{{ report.title }}</div>
        <p class="mt-0.5 text-xs leading-5 text-slate-400">{{ report.subtitle }}</p>
      </div>
    </button>
  }
</div>
