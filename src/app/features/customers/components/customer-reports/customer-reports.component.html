<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
  @for (report of cards; track report.id) {
    <button
      type="button"
      (click)="onOpen(report)"
      [attr.aria-pressed]="isActive(report)"
      class="report-card group flex flex-col gap-3 rounded-xl border border-slate-200 bg-white p-4 text-left shadow-sm"
      [class.report-card--active]="isActive(report)"
    >
      <span class="flex items-start justify-between gap-3">
        <span class="flex min-w-0 items-center gap-3">
          <span
            class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl transition-all duration-200"
            [class]="iconClass(report)"
            aria-hidden="true"
          >
            <i [class]="report.icon" class="pi text-lg"></i>
          </span>
          <span class="text-sm font-semibold text-slate-800">{{ report.title }}</span>
        </span>
        @if (isActive(report)) {
          <span class="active-badge" role="status">Active</span>
        }
      </span>
      <p class="text-xs leading-5 text-slate-400">{{ report.subtitle }}</p>
    </button>
  }
</div>
